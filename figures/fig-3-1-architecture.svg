<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 508" width="740" height="508"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"
     aria-label="SeeSense architecture and the life of one frame: phone client, FastAPI server and MongoDB Atlas">

  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f4855"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a16207"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a3"/>
    </marker>
  </defs>

  <style>
    .panel  { fill:#fbfcfd; stroke:#c3cbd6; stroke-width:1; }
    .phead  { fill:#e9edf3; stroke:#c3cbd6; stroke-width:1; }
    .ptitle { font-size:12.5px; font-weight:700; fill:#0b1220; letter-spacing:.35px; }
    .psub   { font-size:9px; fill:#5b6470; letter-spacing:.2px; }
    .box    { fill:#ffffff; stroke:#b9c2ce; stroke-width:1; }
    .btitle { font-size:11.5px; font-weight:700; fill:#16181d; }
    .bsub   { font-size:9.2px; fill:#5b6470; }
    .mono   { font-family:'SF Mono', Menlo, Consolas, monospace; font-size:8.6px; fill:#334155; }
    .hot    { fill:#f4f7fb; stroke:#9db2cd; stroke-width:1.1; }
    .hotlbl { font-size:9.6px; font-weight:700; fill:#31527a; letter-spacing:.4px; }
    .cold   { fill:#fdf7ec; stroke:#dcc08e; stroke-width:1; }
    .coldt  { font-size:10.5px; font-weight:700; fill:#7a4f01; }
    .colds  { font-size:9.2px; fill:#8a6a2f; }
    .gate   { fill:#fdf3f3; stroke:#dda9a9; stroke-width:1; }
    .call   { fill:#f2f8f7; stroke:#8fbdb7; stroke-width:1; }
    .callt  { font-size:9.6px; fill:#155e56; }
    .flow   { font-size:9.2px; font-weight:700; fill:#1d4ed8; letter-spacing:.2px; }
    .flowb  { font-size:9.2px; font-weight:700; fill:#0f766e; letter-spacing:.2px; }
    .coll   { font-size:9.4px; fill:#24303f; }
    .ttl    { font-size:8.4px; fill:#7b8695; }
    .note   { font-size:8.7px; fill:#5b6470; }
    .badge  { font-size:9.5px; font-weight:700; fill:#ffffff; }
    .badgeo { font-size:9.5px; font-weight:700; fill:#1d4ed8; }
    .leg    { font-size:9.2px; fill:#5b6470; }
  </style>

  <!-- ══════════════════ PHONE ══════════════════ -->
  <rect class="panel" x="12" y="12" width="208" height="454" rx="4"/>
  <path class="phead" d="M12,16 a4,4 0 0 1 4,-4 h200 a4,4 0 0 1 4,4 v20 h-208 z"/>
  <text class="ptitle" x="24" y="28">PHONE — browser</text>
  <text class="psub"   x="24" y="47">React 19 · Hebrew RTL · no installation</text>

  <!-- camera -->
  <rect class="box" x="22" y="54" width="188" height="26" rx="3"/>
  <text class="btitle" x="32" y="70">camera <tspan class="bsub">— getUserMedia, 1280×720</tspan></text>

  <path d="M116,80 L116,88" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- alignment gate -->
  <rect class="gate" x="22" y="90" width="188" height="30" rx="3"/>
  <text class="btitle" x="32" y="104">alignment gate · gyroscope</text>
  <text class="bsub"   x="32" y="115">|β − 90°| ≤ 15°, else nothing is sent</text>

  <path d="M116,120 L116,128" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- A capture -->
  <rect class="box" x="22" y="130" width="188" height="30" rx="3"/>
  <circle cx="36" cy="145" r="8.5" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
  <text class="badgeo" x="36" y="148.5" text-anchor="middle">A</text>
  <text class="btitle" x="52" y="144">capture</text>
  <text class="bsub"   x="52" y="155">centre square → 640² canvas</text>

  <path d="M116,160 L116,166" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- B encode -->
  <rect class="box" x="22" y="168" width="188" height="30" rx="3"/>
  <circle cx="36" cy="183" r="8.5" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
  <text class="badgeo" x="36" y="186.5" text-anchor="middle">B</text>
  <text class="btitle" x="52" y="182">encode</text>
  <text class="bsub"   x="52" y="193">toBlob JPEG, quality 0.25</text>

  <path d="M116,198 L116,204" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- queue -->
  <rect class="box" x="22" y="206" width="188" height="30" rx="3" stroke="#1d4ed8" stroke-dasharray="3 2"/>
  <text class="btitle" x="32" y="220">bounded queue</text>
  <text class="bsub"   x="32" y="231">≤ 6 in flight — the only rate control</text>

  <!-- reply pairing -->
  <rect x="22" y="244" width="188" height="44" rx="3" fill="#f7f9fb" stroke="#dbe1e9" stroke-width="1" stroke-dasharray="3 2"/>
  <text class="bsub" x="32" y="259">each reply is matched to the oldest</text>
  <text class="bsub" x="32" y="270">outstanding send timestamp: that is</text>
  <text class="bsub" x="32" y="281">this frame's RTT, and a freed slot.</text>

  <!-- C render -->
  <rect class="box" x="22" y="296" width="188" height="30" rx="3"/>
  <circle cx="36" cy="311" r="8.5" fill="none" stroke="#0f766e" stroke-width="1.3"/>
  <text class="badgeo" x="36" y="314.5" text-anchor="middle" fill="#0f766e">C</text>
  <text class="btitle" x="52" y="310">render</text>
  <text class="bsub"   x="52" y="321">SVG overlay, one box per track ID</text>

  <path d="M116,326 L116,332" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- D feedback -->
  <rect class="box" x="22" y="334" width="188" height="40" rx="3"/>
  <circle cx="36" cy="354" r="8.5" fill="none" stroke="#0f766e" stroke-width="1.3"/>
  <text class="badgeo" x="36" y="357.5" text-anchor="middle" fill="#0f766e">D</text>
  <text class="btitle" x="52" y="348">feedback</text>
  <text class="bsub"   x="52" y="359">Hebrew speech + haptic patterns</text>
  <text class="bsub"   x="52" y="370" font-weight="700" fill="#0f766e">fires only if alert_is_new</text>

  <!-- asymmetry callout -->
  <rect class="call" x="22" y="382" width="188" height="30" rx="3"/>
  <text class="callt" x="32" y="395">visual overlay: every frame.</text>
  <text class="callt" x="32" y="406">speech and haptics: on change only.</text>

  <!-- watchdog -->
  <rect class="box" x="22" y="420" width="188" height="32" rx="3" stroke-dasharray="3 2"/>
  <text class="btitle" x="32" y="434">health watchdog</text>
  <text class="bsub"   x="32" y="445">GET /health every 5 s · 100/150/200 ms</text>

  <!-- ══════════════════ SERVER ══════════════════ -->
  <rect class="panel" x="262" y="12" width="308" height="454" rx="4"/>
  <path class="phead" d="M262,16 a4,4 0 0 1 4,-4 h300 a4,4 0 0 1 4,4 v20 h-308 z"/>
  <text class="ptitle" x="274" y="28">SERVER — FastAPI · Uvicorn</text>

  <!-- connect -->
  <rect class="box" x="272" y="44" width="288" height="48" rx="3"/>
  <text class="mono"  x="282" y="58">WS /stream/ws?token=…&amp;input_size=640</text>
  <text class="bsub"  x="282" y="72">4001 no token · 4003 invalid — distinct codes, no retry</text>
  <text class="bsub"  x="282" y="84">settings read once at connect — zero DB reads per frame</text>

  <path d="M416,92 L416,100" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- session -->
  <rect class="box" x="272" y="102" width="288" height="30" rx="3"/>
  <text class="btitle" x="282" y="116">session</text>
  <text class="bsub"   x="282" y="127">reuse the active one, or resume a stop &lt; 15 min old</text>

  <path d="M416,132 L416,142" stroke="#8b95a3" stroke-width="1.2" marker-end="url(#aGrey)"/>

  <!-- hot path container -->
  <rect class="hot" x="272" y="148" width="288" height="232" rx="4"/>
  <text class="hotlbl" x="282" y="164">HOT PATH — one frame in, one verdict out</text>

  <rect class="box" x="282" y="172" width="268" height="30" rx="3"/>
  <circle cx="297" cy="187" r="8.5" fill="#31527a"/>
  <text class="badge" x="297" y="190.5" text-anchor="middle">1</text>
  <text class="btitle" x="313" y="186">decode + quality gates</text>
  <text class="bsub"   x="313" y="197">letterbox 640², grey 114 · covered / dark / bright / blur</text>

  <rect class="box" x="282" y="208" width="268" height="30" rx="3"/>
  <circle cx="297" cy="223" r="8.5" fill="#31527a"/>
  <text class="badge" x="297" y="226.5" text-anchor="middle">2</text>
  <text class="btitle" x="313" y="222">YOLO inference</text>
  <text class="bsub"   x="313" y="233">worker thread, one at a time behind a global lock</text>

  <rect class="box" x="282" y="244" width="268" height="30" rx="3"/>
  <circle cx="297" cy="259" r="8.5" fill="#31527a"/>
  <text class="badge" x="297" y="262.5" text-anchor="middle">3</text>
  <text class="btitle" x="313" y="258">multi-object tracking</text>
  <text class="bsub"   x="313" y="269">two-stage, class-gated · IoU + Hungarian · motion trend</text>

  <rect class="box" x="282" y="280" width="268" height="30" rx="3"/>
  <circle cx="297" cy="295" r="8.5" fill="#31527a"/>
  <text class="badge" x="297" y="298.5" text-anchor="middle">4</text>
  <text class="btitle" x="313" y="294">danger assessment</text>
  <text class="bsub"   x="313" y="305">profile → distance → motion-first alert level</text>

  <rect class="box" x="282" y="316" width="268" height="30" rx="3"/>
  <circle cx="297" cy="331" r="8.5" fill="#31527a"/>
  <text class="badge" x="297" y="334.5" text-anchor="middle">5</text>
  <text class="btitle" x="313" y="330">build record</text>
  <text class="bsub"   x="313" y="341">pre-generated ObjectId — no database I/O</text>

  <text class="bsub" x="282" y="364">clearance by presence, not by alert level ·</text>
  <text class="bsub" x="282" y="374">alert_is_new only on a genuine escalation</text>

  <!-- off the hot path -->
  <rect class="cold" x="272" y="402" width="288" height="52" rx="3"/>
  <text class="coldt" x="282" y="415">off the hot path — after the response is sent</text>
  <text class="colds" x="282" y="429">batch writer · one thread · flushes once a second</text>
  <text class="colds" x="282" y="442">per-minute performance metrics · e-mail · session bookkeeping</text>

  <!-- ══════════════════ MONGO ══════════════════ -->
  <rect class="panel" x="606" y="12" width="122" height="454" rx="4"/>
  <path class="phead" d="M606,16 a4,4 0 0 1 4,-4 h114 a4,4 0 0 1 4,4 v20 h-122 z"/>
  <text class="ptitle" x="616" y="28" font-size="11.5px">MongoDB Atlas</text>

  <text class="coll" x="616" y="56">users</text>
  <text class="coll" x="616" y="74">settings</text>
  <text class="coll" x="616" y="92">sessions</text>
  <text class="coll" x="616" y="110">detection_history</text>
  <text class="coll" x="616" y="128">feedback</text>
  <text class="coll" x="616" y="146">emergency_alerts</text>
  <text class="coll" x="616" y="164">blacklisted_tokens</text>
  <text class="ttl"  x="616" y="175">TTL 24 h</text>
  <text class="coll" x="616" y="193">reset_codes</text>
  <text class="ttl"  x="616" y="204">TTL 15 min</text>
  <text class="coll" x="616" y="222">perf_history</text>
  <text class="ttl"  x="616" y="233">TTL ≈ 400 days</text>
  <text class="coll" x="616" y="251">perf_meta</text>
  <text class="ttl"  x="616" y="262">when measuring began</text>

  <line x1="616" y1="274" x2="718" y2="274" stroke="#d5dae2" stroke-width="1"/>
  <text class="note" x="616" y="287">TTL indexes expire tokens,</text>
  <text class="note" x="616" y="298">codes and metrics — no</text>
  <text class="note" x="616" y="309">cleanup job to forget.</text>

  <rect class="call" x="614" y="320" width="106" height="96" rx="3"/>
  <text class="btitle" x="622" y="335" font-size="10.5px" fill="#155e56">No frame is</text>
  <text class="btitle" x="622" y="347" font-size="10.5px" fill="#155e56">ever stored.</text>
  <text class="callt" x="622" y="363" font-size="9px">A history record holds</text>
  <text class="callt" x="622" y="374" font-size="9px">only derived scalars:</text>
  <text class="callt" x="622" y="385" font-size="9px">class, confidence, a</text>
  <text class="callt" x="622" y="396" font-size="9px">Close/Medium/Far</text>
  <text class="callt" x="622" y="407" font-size="9px">band, danger level.</text>

  <text class="note" x="616" y="428" font-weight="700">receives</text>
  <text class="note" x="616" y="440">detection_history,</text>
  <text class="note" x="616" y="451">sessions, perf_history</text>

  <!-- ══════════════════ FLOWS ══════════════════ -->

  <!-- frame out: queue → stage 1 -->
  <line x1="220" y1="221" x2="278" y2="221" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <text class="flow" x="241" y="214" text-anchor="middle" font-size="8.4px">frame</text>

  <!-- verdict back: server → render -->
  <path d="M266,388 L241,388 L241,311 L216,311" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <text class="flowb" x="230" y="266" transform="rotate(-90 230 266)" text-anchor="middle">JSON verdict</text>
  <circle cx="287" cy="389" r="8.5" fill="#31527a"/>
  <text class="badge" x="287" y="392.5" text-anchor="middle">6</text>
  <text class="btitle" x="303" y="393" font-size="10.5px">response <tspan class="bsub">— serialise the verdict and send it</tspan></text>

  <!-- batched writes → mongo -->
  <line x1="560" y1="424" x2="602" y2="424" stroke="#a16207" stroke-width="1.4" marker-end="url(#aAmber)"/>
  <text class="bsub" x="581" y="418" font-size="8.4px" fill="#a16207" text-anchor="middle">writes</text>

  <!-- settings read at connect -->
  <line x1="602" y1="68" x2="564" y2="68" stroke="#8b95a3" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#aGrey)"/>
  <text class="bsub" x="558" y="62" font-size="8.4px" text-anchor="end">settings ×1</text>

  <!-- ══════════════════ LEGEND ══════════════════ -->
  <line x1="12" y1="478" x2="728" y2="478" stroke="#d5dae2" stroke-width="1"/>
  <circle cx="20" cy="491" r="7.5" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
  <text class="badgeo" x="20" y="494.5" text-anchor="middle" font-size="8.5px">A</text>
  <text class="leg" x="32" y="494">four client timed stages</text>
  <circle cx="176" cy="491" r="7.5" fill="#31527a"/>
  <text class="badge" x="176" y="494.5" text-anchor="middle" font-size="8.5px">1</text>
  <text class="leg" x="188" y="494">six server timed stages</text>
  <line x1="330" y1="491" x2="352" y2="491" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <text class="leg" x="358" y="494">binary JPEG frame up</text>
  <line x1="470" y1="491" x2="492" y2="491" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <text class="leg" x="498" y="494">JSON verdict down</text>
  <line x1="580" y1="491" x2="602" y2="491" stroke="#a16207" stroke-width="1.4" marker-end="url(#aAmber)"/>
  <text class="leg" x="608" y="494">deferred write</text>
</svg>
